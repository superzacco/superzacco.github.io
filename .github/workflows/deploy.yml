name: Deploy site

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write
  
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Substitute API key placeholder
        run: sed -i "s/__POST_GETTER_API_KEY__/${{ secrets.API_KEY }}/g" latestytupload.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4